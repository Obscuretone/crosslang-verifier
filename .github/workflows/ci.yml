name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            backend: local
          - python: '3.13'
            backend: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package and checks
        run: python -m pip install -e '.[dev]' -c requirements-dev.lock
      - name: Download isolated runner images
        if: matrix.backend == 'docker'
        run: |
          docker pull node:22-bookworm-slim
          docker pull rust:1-slim-bookworm
      - name: Dump raw syntax trees without a manifest
        run: |
          mkdir -p ci-evidence
          ast_exit=0
          crosslang-verifier --raw examples/linkedin-error-fallback/original.ts \
            examples/linkedin-error-fallback/migrated.rs \
            --output-dir ci-evidence/asts --json-output ci-evidence/ast-comparison.json \
            > ci-evidence/ast-console.txt || ast_exit=$?
          test "$ast_exit" -eq 1
      - name: Check shared AST parity, difference and unresolved results
        run: |
          for variant in equivalent different unresolved; do
            parity_exit=0
            crosslang-verifier examples/parity/equivalent.ts examples/parity/$variant.rs \
              --output-dir ci-evidence/parity/$variant \
              --json-output ci-evidence/parity/$variant.json \
              > ci-evidence/parity-$variant.txt || parity_exit=$?
            case "$variant" in
              equivalent) test "$parity_exit" -eq 0 ;;
              different) test "$parity_exit" -eq 1 ;;
              unresolved) test "$parity_exit" -eq 2 ;;
            esac
          done
      - name: Lint and package
        run: |
          ruff check .
          ruff format --check .
          python -m build
      - name: Check renamed command entry points
        run: |
          crosslang-verifier --version
          obscuretone-diff --version
          python -m crosslang_verifier --version
      - name: Verify fixture generator is reproducible
        run: |
          python tools/generate_fixtures.py
          git diff --exit-code -- fixtures
      - name: Run all tests with real Node and Cargo
        run: |
          mkdir -p ci-evidence
          pytest -q --run-integration --integration-backend=${{ matrix.backend }} \
            --cov=crosslang_verifier --cov-fail-under=85 \
            --cov-report=term-missing --cov-report=json:ci-evidence/coverage.json \
            --junitxml=ci-evidence/pytest.xml
      - name: Emit complete CLI corpus evidence
        run: |
          crosslang-verifier suite fixtures --execute --backend=${{ matrix.backend }} \
            --json-output ci-evidence/corpus.json > ci-evidence/corpus-console.txt
      - name: Record runtime provenance
        if: always()
        run: python tools/record_environment.py --backend=${{ matrix.backend }} --output ci-evidence/environment.json
      # Keep the named reproduction separate from the historical 40-fixture corpus.
      - name: Check LinkedIn fallback reproduction
        run: |
          python tools/check_linkedin_example.py --backend=${{ matrix.backend }} \
            --json-output ci-evidence/linkedin-example.json > ci-evidence/linkedin-example-console.txt
      - name: Record renamed package metadata
        if: always()
        run: python -m pip show crosslang-verifier > ci-evidence/package-metadata.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-py${{ matrix.python }}-${{ matrix.backend }}
          path: ci-evidence/
          retention-days: 30
